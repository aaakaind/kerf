# Build every KERF package from this repository on GitHub's runners and publish them as a release.
# Runs when a v* tag is pushed, or by hand: Actions → Release → Run workflow.
# Android signing: add repository secrets KERF_KEYSTORE_B64 (base64 of the .jks) and KERF_KS_PASS.
# Without them the release reuses the signed APK committed in android/prebuilt/ for that version.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.2.0'
        required: true
        default: 'v0.2.0'
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package web build
        run: |
          V=$(node -p "require('./package.json').version")
          cd dist && zip -q -r "../kerf-$V-web.zip" index.html occt.wasm.gz planegcs.wasm manifold.wasm rhino3dm.wasm pdf.worker.min.mjs fonts "kerf-$V-source.zip"
          cp "kerf-$V-source.zip" ..
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: pkg-web, path: 'kerf-*.zip', retention-days: 3 }

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: 'dist:linux', files: "desktop/release/*.AppImage\ndesktop/release/*.deb" }
          - { os: windows-latest, script: 'dist:win', files: "desktop/release/*.exe\ndesktop/release/*.zip" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: 'pkg-${{ matrix.os }}', path: '${{ matrix.files }}', retention-days: 3 }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Build and sign the APK
        env:
          KERF_KEYSTORE_B64: ${{ secrets.KERF_KEYSTORE_B64 }}
          KERF_KS_PASS: ${{ secrets.KERF_KS_PASS }}
        run: |
          V=$(node -p "require('./package.json').version"); mkdir -p apk
          if [ -n "$KERF_KEYSTORE_B64" ] && [ -n "$KERF_KS_PASS" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" > /dev/null
            echo "$KERF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kerf.jks"
            ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0" ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" \
              KERF_KEYSTORE="$RUNNER_TEMP/kerf.jks" KERF_KS_PASS="$KERF_KS_PASS" ./android/build.sh
            cp "android/out/KERF-$V-android.apk" apk/
            rm -f "$RUNNER_TEMP/kerf.jks"
          elif [ -f "android/prebuilt/KERF-$V-android.apk" ]; then
            echo "No signing secrets: publishing the release-signed APK from android/prebuilt/"
            cp "android/prebuilt/KERF-$V-android.apk" apk/
          else
            echo "::warning::No signing secrets and no prebuilt APK for $V — the release will have no Android build."
          fi
      - uses: actions/upload-artifact@v4
        with: { name: pkg-android, path: apk/, retention-days: 3, if-no-files-found: ignore }

  release:
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'pkg-*', path: out, merge-multiple: true }
      - name: Checksums
        run: |
          cd out && ls -la && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          V=$(node -p "require('./package.json').version")
          NOTES=docs/releases/$TAG.md; [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "KERF $V" --notes-file "$NOTES"
          fi
